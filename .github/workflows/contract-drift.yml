name: Contract drift

# Cross-repo contract drift check. The catalog repo
# (WeAreHausTech/haus-workflow-catalog) is the source of truth for
# validation-rules.json, manifest/catalog-item schemas, and haus-lock schema;
# this CLI consumes SYNCED copies. scripts/contract-check.mjs fetches the LIVE
# catalog and diffs it against the committed copies so drift surfaces in CI.
#
# Strictness model (derived from GITHUB_EVENT_NAME inside the script):
#   - pull_request : drift => WARN (exit 0). Don't block feature work on an
#                    out-of-band catalog change; the sync PR is a separate flow.
#   - push to main : drift => FAIL.
#   - schedule     : drift => FAIL (daily catch for silent drift).

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Daily at 06:00 UTC.
    - cron: '0 6 * * 3'

permissions:
  contents: read

jobs:
  contract-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # No yarn install needed: contract-check.mjs uses only Node built-ins +
      # global fetch (Node >=18). Strictness is derived from GITHUB_EVENT_NAME.
      - name: Contract check (live catalog vs committed)
        run: node scripts/contract-check.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Validator behavior-parity check (ADR-0024). Distinct from the drift check
  # above: that one compares DATA (validation-rules.json, schema shape); this one
  # runs both repos' actual validator LOGIC against a shared fixture set and
  # asserts they agree on every item's pass/fail verdict. Runs on every trigger
  # (unlike contract-check.mjs, which is deliberately network-only to stay fast
  # on PRs) since it needs a real second checkout either way — see ADR-0024.
  contract-behavior-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout haus-workflow
        uses: actions/checkout@v7
        with:
          path: haus-workflow

      - name: Checkout haus-workflow-catalog
        uses: actions/checkout@v7
        with:
          repository: WeAreHausTech/haus-workflow-catalog
          path: haus-workflow-catalog

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install haus-workflow-catalog deps
        working-directory: haus-workflow-catalog
        run: corepack enable && yarn install --immutable

      - name: Install haus-workflow deps
        working-directory: haus-workflow
        run: corepack enable && yarn install --immutable

      - name: Contract behavior check (validator logic parity)
        working-directory: haus-workflow
        run: yarn check:contract-behavior
        env:
          HAUS_CATALOG_REPO_PATH: ${{ github.workspace }}/haus-workflow-catalog
          # Fail hard on push to main / scheduled cron; WARN on PR (same tiering
          # as contract-check.mjs above, derived here since this script reads an
          # env var rather than GITHUB_EVENT_NAME directly).
          CONTRACT_STRICT: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && '1' || '0' }}
