version: 2

updates:
  #
  # GitHub Actions
  #
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Stockholm

    open-pull-requests-limit: 5

    commit-message:
      prefix: 'ci'

    labels:
      - dependencies
      - github-actions

    groups:
      github-actions:
        patterns:
          - '*'
  #
  # npm / Yarn
  #
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:30'
      timezone: Europe/Stockholm

    open-pull-requests-limit: 5

    commit-message:
      prefix: 'deps'

    labels:
      - dependencies

    groups:
      production:
        dependency-type: production
        update-types:
          - minor
          - patch

      development:
        dependency-type: development
        update-types:
          - minor
          - patch

      security:
        applies-to: security-updates
        patterns:
          - '*'
    ignore:
      # Major bumps: deliberate upgrade, not auto-PR.
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      # Unfixable transitive advisories: add dependency-name here after triage
      # (e.g. fixed via yarn resolutions). Stops repeat failed security PRs.
    allow:
      - dependency-type: direct
